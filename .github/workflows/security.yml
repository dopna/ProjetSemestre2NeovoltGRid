name: Security Pipeline

on:
  push:
  pull_request:

jobs:

  security_scan:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tools
        run: |
          pip install bandit
          pip install safety

      - name: Bandit Scan
        run: |
          bandit -r .

      - name: Safety Scan
        run: |
          safety check || true